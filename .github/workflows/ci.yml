name: CI / Model Validation

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  runtime-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements-web.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployable application image
        run: docker build -t satmodclass:ci .
      - name: Check the running image with real inference and uploads
        env:
          SATMOD_ACCESS_TOKEN: ci-only-local-container-key
        run: |
          docker volume create satmod-ci-data
          docker run -d --name satmodclass-ci -e SATMOD_ACCESS_TOKEN --mount type=volume,src=satmod-ci-data,dst=/data -p 127.0.0.1:8000:8000 satmodclass:ci
          python scripts/check_deployment.py http://127.0.0.1:8000 --wait-seconds 90
          python scripts/check_workspace_deployment.py http://127.0.0.1:8000 --state-file /tmp/workspace-state.json
          docker rm -f satmodclass-ci
          docker run -d --name satmodclass-ci -e SATMOD_ACCESS_TOKEN --mount type=volume,src=satmod-ci-data,dst=/data -p 127.0.0.1:8000:8000 satmodclass:ci
          python scripts/check_workspace_deployment.py http://127.0.0.1:8000 --state-file /tmp/workspace-state.json --verify-existing
      - name: Show container logs
        if: always()
        run: docker logs satmodclass-ci || true

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          # Stop build if syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run unit test suite
        run: |
          pytest tests/ -v

  frontend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit all frontend dependencies
        working-directory: frontend
        run: npm audit
      - name: Check frontend types, lint, routes, and components
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Exercise real client-to-Python contracts
        working-directory: frontend
        env:
          SATMOD_PYTHON: python
        run: npm run test:integration
      - name: Build production frontend and check SPA hosting
        run: |
          npm --prefix frontend run build
          python scripts/check_production.py
      - name: Record the preinstalled Linux browser
        if: runner.os == 'Linux'
        run: google-chrome --version
      - name: Install Windows Chromium
        if: runner.os == 'Windows'
        working-directory: frontend
        run: npx playwright install chromium
      - name: Exercise the compiled application in Chromium
        working-directory: frontend
        env:
          SATMOD_PYTHON: python
          SATMOD_TEST_API_URL: http://127.0.0.1:8000
          SATMOD_TEST_BASE_URL: http://127.0.0.1:8000
          SATMOD_TEST_PRODUCTION: "1"
          PLAYWRIGHT_CHANNEL: ${{ runner.os == 'Linux' && 'chrome' || '' }}
        run: npm run test:e2e -- --reporter=list,html
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-diagnostics-${{ matrix.os }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            integration/validation/
          retention-days: 14
