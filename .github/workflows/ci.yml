name: CI / Model Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          # Stop build if syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run unit test suite
        run: |
          pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Check frontend types, lint, routes, and components
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Exercise real client-to-Python contracts
        working-directory: frontend
        env:
          SATMOD_PYTHON: python
        run: npm run test:integration
      - name: Build production frontend and check SPA hosting
        run: |
          npm --prefix frontend run build
          python scripts/check_production.py
